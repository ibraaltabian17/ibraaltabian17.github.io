<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Lyrics Converter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }
        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .box h2 {
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        textarea {
            width: 100%;
            height: 500px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
            font-size: 14px;
            background-color: #fafafa;
        }
        button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 20px 0;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-small {
            background-color: #2ecc71;
            padding: 6px 12px;
            font-size: 12px;
            margin: 0;
        }
        .btn-small:hover {
            background-color: #27ae60;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            width: 100%;
            max-width: 1200px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .option-item label {
            cursor: pointer;
            user-select: none;
        }
        .option-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .option-item.sub {
            padding-left: 12px;
            border-left: 2px solid #ddd;
        }
        .option-item.number {
            gap: 4px;
        }
        .option-item.number input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>KpoeTools JSON to Lyrics Converter</h1>

    <div class="options">
        <div class="option-item">
            <input type="checkbox" id="syllableToggle" onchange="onSyllableToggleChange()">
            <label for="syllableToggle">Enable syllable split</label>
        </div>
        <div class="option-item sub">
            <input type="checkbox" id="syncModeToggle" disabled="" onchange="convertJSON()">
            <label for="syncModeToggle">Sync mode (resync helper)</label>
        </div>
        <div class="option-item sub number">
            <label for="gapThreshold">Gap threshold (ms):</label>
            <input type="number" id="gapThreshold" value="5" min="0" onchange="convertJSON()">
        </div>
    </div>

    <button onclick="convertJSON()">Convert JSON ➔</button>
    <div id="errorMessage" class="error"></div>

    <div class="container">
        <!-- Input Section -->
        <div class="box">
            <h2>Input JSON</h2>
            <textarea id="jsonInput" placeholder="Paste your KpoeTools JSON here..."></textarea>
        </div>

        <!-- Output Section -->
        <div class="box">
            <h2>
                Formatted Output
                <button class="btn-small" onclick="copyToClipboard()">Copy Text</button>
            </h2>
            <textarea id="textOutput" placeholder="Your formatted text will appear here..." readonly=""></textarea>
        </div>
    </div>

    <script>
        function onSyllableToggleChange() {
            const syllableEnabled = document.getElementById('syllableToggle').checked;
            const syncToggle = document.getElementById('syncModeToggle');
            syncToggle.disabled = !syllableEnabled;
            if (!syllableEnabled) {
                syncToggle.checked = false;
            }
            convertJSON();
        }

        // Build the text for a single lyric line's syllables, following the
        // Kmake syllable-split syntax:
        //   - "]" separates syllables within the same word
        //   - a space (not "]") separates the last syllable of a word from
        //     the next word
        //   - the end of the line has no trailing separator at all
        //   - in sync mode, a gap (+/- threshold ms) between the previous
        //     syllable's end and the next syllable's start doubles the
        //     separator: "]" -> "]]", or a single trailing space -> two
        //     trailing spaces. A background/non-background switch between
        //     consecutive syllables also doubles the separator.
        function buildSyllableText(syllabus, syncMode, gapThresholdMs) {
            if (!Array.isArray(syllabus) || syllabus.length === 0) return "";

            let result = "";

            for (let i = 0; i < syllabus.length; i++) {
                const syl = syllabus[i];
                const rawText = syl.text || "";
                const isLast = i === syllabus.length - 1;

                // Does this syllable's raw text end with a space? That marks
                // the end of a word (word boundary), as opposed to a mid-word
                // syllable break (which uses "]").
                const endsWithSpace = /\s$/.test(rawText);
                const trimmedText = endsWithSpace ? rawText.replace(/\s+$/, "") : rawText;

                result += trimmedText;

                if (isLast) {
                    // End of line: no trailing separator at all.
                    continue;
                }

                const nextSyl = syllabus[i + 1];

                // Determine base separator: "]" for mid-word, " " for word end.
                let separator = endsWithSpace ? " " : "]";

                if (syncMode) {
                    let doubled = false;

                    // Gap check: compare end of current syllable to start of next.
                    if (typeof syl.time === "number" && typeof syl.duration === "number" &&
                        typeof nextSyl.time === "number") {
                        const currentEnd = syl.time + syl.duration;
                        const gap = nextSyl.time - currentEnd;
                        if (Math.abs(gap) > gapThresholdMs) {
                            doubled = true;
                        }
                    }

                    // Background / non-background switch also doubles separator.
                    const curBg = !!syl.isBackground;
                    const nextBg = !!nextSyl.isBackground;
                    if (curBg !== nextBg) {
                        doubled = true;
                    }

                    if (doubled) {
                        separator = separator === "]" ? "]]" : "  ";
                    }
                }

                result += separator;
            }

            return result;
        }

        function convertJSON() {
            const inputElement = document.getElementById('jsonInput');
            const outputElement = document.getElementById('textOutput');
            const errorElement = document.getElementById('errorMessage');
            const syllableEnabled = document.getElementById('syllableToggle').checked;
            const syncMode = document.getElementById('syncModeToggle').checked;
            const gapThreshold = parseFloat(document.getElementById('gapThreshold').value) || 0;

            errorElement.style.display = 'none';
            outputElement.value = '';

            const inputStr = inputElement.value.trim();
            if (!inputStr) {
                return;
            }

            try {
                const data = JSON.parse(inputStr);
                let outputLines = [];

                // 1. Process Agents
                const agents = (data.metadata && data.metadata.agents) ? data.metadata.agents : {};
                for (const [alias, agentInfo] of Object.entries(agents)) {
                    const type = agentInfo.type || "person";
                    const name = agentInfo.name || alias;
                    outputLines.push(`[agent:${type}=${alias}:${name}]`);
                }
                
                outputLines.push(""); // Empty line after agents

                // 2. Process Song Parts (Section Mapping, no numbering)
                const songParts = (data.metadata && data.metadata.songParts) ? data.metadata.songParts : [];

                const partDisplayNames = {};
                songParts.forEach((part, idx) => {
                    const name = part.name || "Unknown";
                    partDisplayNames[idx] = name;
                });

                // 3. Process Lyrics
                const lyrics = data.lyrics || [];
                let currentPartIdx = -1;

                lyrics.forEach(line => {
                    const element = line.element || {};
                    const partIdx = element.songPartIndex;
                    const singer = element.singer || "v1";
                    const text = line.text || "";

                    // Check if we shifted to a new section
                    if (partIdx !== currentPartIdx) {
                        if (currentPartIdx !== -1) {
                            outputLines.push(""); // Add blank line between sections
                        }
                        const partName = partDisplayNames[partIdx] || `Section ${partIdx}`;
                        outputLines.push(`#${partName}`);
                        currentPartIdx = partIdx;
                    }

                    // Add the lyric line, either plain text or syllable-split
                    if (syllableEnabled && Array.isArray(line.syllabus) && line.syllabus.length > 0) {
                        const syllableText = buildSyllableText(line.syllabus, syncMode, gapThreshold);
                        outputLines.push(`${singer}:${syllableText}`);
                    } else {
                        outputLines.push(`${singer}:${text}`);
                    }
                });

                // Update Output text area
                outputElement.value = outputLines.join('\n');

            } catch (error) {
                showError("Invalid JSON format! Please check your input. Error details: " + error.message);
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.innerText = message;
            errorElement.style.display = 'block';
        }

        function copyToClipboard() {
            const outputElement = document.getElementById('textOutput');
            if (!outputElement.value) return;

            outputElement.select();
            outputElement.setSelectionRange(0, 99999); // For mobile devices

            navigator.clipboard.writeText(outputElement.value).then(() => {
                alert("Copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy: " + err);
            });
        }
    </script>


</body></html>
